# VK API: service-токен для поиска (newsfeed.search, wall.get, friends.get, groups.get)
# НЕ работает для likes.add. Получить: https://dev.vk.ru/ru/admin/create-app → Ключи доступа
# Лимит без верификации: 10 000 вызовов/мес
api:
  service_token: "" # service-токен приложения (задать через env var VK_SERVICE_TOKEN)
  api_version: "5.131" # версия VK API
  base_url: "https://api.vk.ru/method" # базовый URL для вызовов

# Браузер: Selenium Chrome с персистентным профилем (сохраняет сессию VK между запусками)
browser:
  profile_path: "./chrome_profile" # каталог профиля Chrome; при первичном логине (2FA) headless должен быть false
  headless: true # скрытый режим

# Поиск и сбор постов: источники, лимиты глубины, фильтр по давности
search:
  user_id: 12345678 # VK ID пользователя (для auto_friends / auto_groups)
  queries: [] # текстовые запросы через newsfeed.search
  hashtags: # хештеги через newsfeed.search
    - "#СоздаюСвойМагнит"
    - "#яВыбираюМагнит"
  groups: [] # короткие имена сообществ (screen_name) → wall.get
  accounts: [] # короткие имена пользователей (screen_name) → wall.get
  auto_friends: true # автоматический сбор постов со стен друзей (friends.get → wall.get)
  auto_groups: true # автоматический сбор постов со стен подписок (groups.get → wall.get)
  max_posts_per_query: 100 # лимит постов с одного текстового запроса
  max_posts_per_hashtag: 100 # лимит постов с одного хештега (1 API-вызов, пагинация через start_time)
  max_posts_per_group: 100 # лимит постов со стены одной группы
  max_posts_per_account: 100 # лимит постов со стены одного пользователя
  max_posts_per_friend: 10 # лимит постов со стены одного друга
  max_friends_to_collect: 200 # макс. число API-вызовов wall.get к друзьям (из всех друзей, случайно)
  max_groups_to_collect: 200 # макс. число API-вызовов wall.get к группам (из всех групп, случайно)
  days_back: 30 # не лайкать посты старше N дней
  stop_words: [] # стоп-слова inline (дополнительные к файлу)
  stop_words_file: "stop_words.txt" # файл стоп-слов: одно слово на строку, '#' — комментарий
  filter_mode: "stop_words" # "stop_words" (по словарю) или "llm" (через LLM-классификацию)

# LLM-фильтр тематики постов (litellm). Работает только при filter_mode: "llm"
llm:
  model: "" # идентификатор модели в формате litellm, напр. "openai/gpt-4o-mini"
  api_base: "" # базовый URL API провайдера (пусто = дефолт litellm)
  api_key: "" # ключ API провайдера (задать через env var VK_LLM_API_KEY)
  system_prompt: "" # системный промпт (пусто = дефолтный промпт в src/post_filter.py)
  timeout: 10 # таймаут запроса к LLM, сек
  max_text_length: 500 # макс. длина текста поста, отправляемого в LLM

# Лимиты и задержки (все рандомизируются через random.uniform)
limits:
  likes_per_session_min: 20 # мин. лайков за одну сессию (random от min до max)
  likes_per_session_max: 30 # макс. лайков за одну сессию
  sessions_per_day: 3 # макс. сессий в день
  min_delay_sec: 15 # мин. пауза между лайками
  max_delay_sec: 60 # макс. пауза между лайками
  view_delay_min_sec: 5 # мин. пауза «чтения» поста перед лайком
  view_delay_max_sec: 15 # макс. пауза «чтения» поста перед лайком
  max_captcha_streak: 3 # стоп после N капч подряд

# Логирование в консоль и файл
logging:
  level: "INFO" # DEBUG / INFO / WARNING / ERROR
  file: "vk_autoliker.log" # путь к файлу логов

# SQLite: история обработанных постов и сессий
state:
  db_path: "vk_autoliker.db" # путь к базе данных
